<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#D02B67">
<title>Qo‘ng‘iroq — OSON Sklad</title>
<style>
/* Call redirect: Telegram buttons can't hold tel: links, so the button opens this page and it hands the number to the phone's dialer. */
:root{
  --bg:#FFFFFF;
  --ink:#2B1621;
  --muted:#6E5462;
  --pink:#D02B67;
  --pink-soft:#FDE7EF;
  --call:#1FA855;
  --call-press:#188E47;
  --font:system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font);
  display:flex;align-items:center;justify-content:center;
  padding:24px;-webkit-font-smoothing:antialiased;
}
main{width:100%;max-width:360px;text-align:center}
.brand{
  display:inline-block;font-weight:800;letter-spacing:.04em;font-size:13px;
  color:var(--pink);background:var(--pink-soft);border-radius:999px;padding:6px 14px;
}
.num{font-size:28px;font-weight:800;margin:22px 0 6px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:15px;margin:0 0 26px;line-height:1.45}
.call{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;min-height:58px;border-radius:16px;
  background:var(--call);color:#fff;text-decoration:none;
  font-size:19px;font-weight:800;
  box-shadow:0 6px 18px rgba(31,168,85,.28);
}
.call:active{background:var(--call-press)}
.call svg{width:22px;height:22px;flex:none}
.err .num{color:var(--pink);font-size:20px}
</style>
</head>
<body>
<main id="app">
  <span class="brand">OSON SKLAD</span>
  <div class="num" id="num">…</div>
  <p class="hint" id="hint">Qo‘ng‘iroq oynasi ochilmoqda…</p>
  <a class="call" id="call" href="#" hidden>
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>
    Qo‘ng‘iroq qilish
  </a>
</main>
<script>
(function () {
  // Number comes as ?n=998901234567 (a leading +, spaces or dashes are fine — only digits are kept).
  var m = /[?&]n=([^&#]*)/.exec(location.search);
  var raw = '';
  try { raw = m ? decodeURIComponent(m[1]) : ''; } catch (e) { raw = m ? m[1] : ''; }
  var d = raw.replace(/\D/g, '');
  if (d.length === 9) d = '998' + d;          // 901234567 -> 998901234567

  var numEl = document.getElementById('num');
  var hintEl = document.getElementById('hint');
  var btn = document.getElementById('call');

  if (d.length < 7 || d.length > 15) {
    document.getElementById('app').className = 'err';
    numEl.textContent = 'Raqam topilmadi';
    hintEl.textContent = 'Havolada telefon raqami yo‘q yoki noto‘g‘ri.';
    return;
  }

  var pretty = '+' + d;
  if (d.length === 12 && d.indexOf('998') === 0) {
    pretty = '+998 ' + d.slice(3, 5) + ' ' + d.slice(5, 8) + ' ' + d.slice(8, 10) + ' ' + d.slice(10);
  }
  var tel = 'tel:+' + d;

  numEl.textContent = pretty;
  btn.href = tel;
  btn.hidden = false;
  document.title = pretty + ' — qo‘ng‘iroq';

  // Open the dialer right away; the green button stays as a fallback if the phone blocks the automatic jump.
  setTimeout(function () {
    location.href = tel;
    hintEl.textContent = 'Qo‘ng‘iroq oynasi ochilmasa, pastdagi tugmani bosing.';
  }, 60);
})();
</script>
</body>
</html>
